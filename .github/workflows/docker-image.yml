name: Docker Image CI

on:
  push:
    branches:
      - main
    # tags:
    #   - "v*" # 当推送到以 v 开头的标签（如 v1.0.1）时触发
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: '输入镜像版本号'
        # Default value if no value is explicitly provided
        default: 'manual-latest'
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: string

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限以创建 Release
    # 在这里定义整个 Job 通用的环境变量
    env:
      # 手动构建使用输入版本号，自动构建使用 manual-latest
      IMAGE_TAG: ${{ inputs.name || 'manual-latest' }}
      IMAGE_NAME: "notes"
    
    steps:
    - name: Login to ACR
      uses: docker/login-action@v4
      with:
        registry: crpi-smvzawrxwvafun93.cn-hangzhou.personal.cr.aliyuncs.com
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - uses: actions/checkout@v5
    - name: Build the Docker image and push to ACR
      run: |
        if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
          echo "镜像版本号不符合 Docker 标签格式。" >&2
          exit 1
        fi
        FULL_NAME="${IMAGE_NAME}:${IMAGE_TAG}"
        FILENAME="${IMAGE_NAME}-${IMAGE_TAG}.tar.gz"
        ACR_FULL="crpi-smvzawrxwvafun93.cn-hangzhou.personal.cr.aliyuncs.com/iostat/${FULL_NAME}"
        GHCR_FULL="ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}" # 建议用 lower 转换小写
        
        echo "FULL_NAME=$FULL_NAME" >> $GITHUB_ENV
        echo "FILENAME=$FILENAME" >> $GITHUB_ENV
        echo "ACR_FULL=$ACR_FULL" >> $GITHUB_ENV

        docker build . --file Dockerfile --tag ${ACR_FULL} # --tag ${GHCR_FULL}

        docker save ${ACR_FULL} | gzip > ${FILENAME}

        docker push ${ACR_FULL} 
        # docker push ${GHCR_FULL}

    - name: Upload Tarball
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}
        path: ${{ env.FILENAME }}
        # 设置为 0 表示不进行压缩，直接上传
        compression-level: 0

    # - name: Create GitHub Release
    #   uses: softprops/action-gh-release@v2
    #   with:
    #     files: ${{ env.FILENAME }}
    #     name: Release ${{ env.IMAGE_TAG }}
    #     draft: false
    #     prerelease: false
    #     generate_release_notes: true # 自动生成变更日志
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



    